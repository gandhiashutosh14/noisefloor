[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noisefloor"
version = "0.2.0a1"
description = "A governed SRE autoscaling agent that plans inside a JEPA latent world model, with a pre-registered test of how planning holds up as telemetry turns into noise. CPU only."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Ashutosh Gandhi", email = "gandhiashutosh14@gmail.com" }]
keywords = ["jepa", "world-models", "lejepa", "sigreg", "model-predictive-control", "autoscaling", "sre", "delta-lake", "mlflow", "ai-agents", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch is installed from the CPU wheel index first (see .github/workflows/ci.yml); the PyPI Linux
# wheel pulls CUDA libraries this project never uses.
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=17",
  "deltalake==1.6.6",
  "torch>=2.4",
  "mlflow-skinny>=3.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
audit = ["sternwatch @ git+https://github.com/gandhiashutosh14/sternwatch@v0.4.0-alpha"]

[project.urls]
Homepage = "https://github.com/gandhiashutosh14/noisefloor"
Issues = "https://github.com/gandhiashutosh14/noisefloor/issues"

[project.scripts]
noisefloor = "noisefloor.cli:main"

[tool.setuptools.packages.find]
include = ["noisefloor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# standalone scripts put the repository on sys.path before importing the package
"scripts/*" = ["E402", "E702", "E501"]
