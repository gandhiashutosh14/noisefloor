name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CUDA_VISIBLE_DEVICES: ""
  PYTHONUTF8: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    name: lint, tests and an end-to-end smoke run (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Its own step: the PyPI Linux wheel of torch pulls CUDA libraries this project never uses.
      - name: Install torch (CPU wheel)
        run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,audit]"
      - run: ruff check noisefloor tests scripts
      - run: python -m pytest -q
      - name: Smoke run (200 training steps, 2 evaluation days)
        run: noisefloor smoke
      - name: Audit through STERNWATCH (in-memory log)
        run: noisefloor audit --steps 200 --episodes 2 --out artifacts/audit-memory.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-and-audit
          path: artifacts/
          if-no-files-found: ignore
